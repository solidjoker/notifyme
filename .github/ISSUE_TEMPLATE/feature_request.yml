name: 功能建议
description: 提出新功能或改进现有行为
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        项目路线图见 [docs/ROADMAP.md](../../docs/ROADMAP.md)（M0–M8 里程碑）。
        如果你的想法已在路线图里，欢迎在对应 Issue 下补充使用场景。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述场景与痛点，而不是直接给实现方案
      placeholder: 例：微信以外的 App 通知也很重要，现在必须逐个查看
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望它怎么工作；如果有多种做法，可以都列出并说明取舍
    validations:
      required: true
  - type: dropdown
    id: roadmap
    attributes:
      label: 对应路线图里程碑（如果知道）
      options:
        - M2 跨应用通知
        - M3 隐私脱敏
        - M4 端侧推理
        - M5 iOS 查看端 + 提醒推送
        - M6 前端 UI
        - M7 通知之外的信息
        - M8 智能硬件
        - 不确定 / 不在路线图上
  - type: checkboxes
    id: constraints
    attributes:
      label: 是否符合项目约束
      description: 详见 ROADMAP「非目标」：不做云端多用户与账号体系、不引入 Room/Compose/DI 大重构、open flavor 永不预置密钥
      options:
        - label: 数据仍然本地优先，不强制上传到任何第三方服务
          required: true
        - label: 不要求在 open 发布包里内置任何密钥或私有服务器地址
          required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息（可选）
      description: 截图、竞品参考、你愿意贡献 PR 的部分
