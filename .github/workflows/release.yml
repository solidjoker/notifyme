name: release

# 推送 v* tag 时：用仓库 Secrets 里的密钥库签名构建 open release APK，
# 校验签名与版本号，算 SHA256，然后创建 GitHub Release 并挂上产物。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   NOTIFYME_KEYSTORE_BASE64   base64 编码的 .jks 文件
#   NOTIFYME_KEYSTORE_PASSWORD 密钥库口令
#   NOTIFYME_KEY_ALIAS         密钥别名
#   NOTIFYME_KEY_PASSWORD      密钥口令
# 生成 base64（PowerShell）：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("notifyme-release.jks")) | Set-Clipboard
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

# 同一个 tag 只允许一个发布流程在跑（重复推送 tag 时取消上一次）
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 签名构建并发布 Release
    # 与 android.yml 同口径钉住 24.04：签名发布流程不该被 runner 镜像迁移打断
    runs-on: ubuntu-24.04
    # 发布流程总体超时：签名构建 + 校验 + 上传，30 分钟足够；卡住就判失败
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (缓存依赖)
        # 停在 v5：gradle/actions v6 起缓存组件不再开源（见 android.yml 同一处注释）
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python (版本校验脚本)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare wrapper for CI
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Ensure Android SDK platform 34 and apksigner
        run: |
          # 后面的「Verify APK signature」要用 build-tools 里的 apksigner，
          # 所以这里除了 platform-34，还要确认 apksigner 存在，缺哪个补哪个。
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER" ] && { [ ! -d "$ANDROID_HOME/platforms/android-34" ] || ! ls -d "$ANDROID_HOME"/build-tools/*/apksigner >/dev/null 2>&1; }; then
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi
          ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1

      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          # 优先用仓库里的版本校验脚本（剥注释后精确匹配，不会命中注释行里的 versionName）
          if [ -f docs/scripts/version_check.py ]; then
            python3 docs/scripts/version_check.py --expect-tag "$GITHUB_REF_NAME"
          else
            # 脚本缺失时的兜底：先去掉行注释再取 versionName
            VN=$(sed -E 's#//.*$##' app/build.gradle.kts | grep -E '^[[:space:]]*versionName[[:space:]]*=' | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo "tag=$TAG  versionName=$VN"
            if [ "$TAG" != "$VN" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName=$VN 不一致，请先升版本号"
              exit 1
            fi
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTIFYME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret NOTIFYME_KEYSTORE_BASE64，无法签名发布（配置方式见本 workflow 顶部注释）"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notifyme-release.jks"
          # 收紧权限：密钥库落盘后只允许当前 runner 用户读写
          chmod 600 "$RUNNER_TEMP/notifyme-release.jks"
          echo "NOTIFYME_KEYSTORE_FILE=$RUNNER_TEMP/notifyme-release.jks" >> "$GITHUB_ENV"

      - name: Fetch llama.cpp v0.5.0 (M4 native source, not committed)
        # 与 android.yml 同一步：third_party/ 已 gitignore，release 构建同样要先拉源码
        run: |
          git clone --depth 1 --branch v0.5.0 \
            https://github.com/ggml-org/llama.cpp third_party/llama.cpp
          git -C third_party/llama.cpp describe --tags

      - name: Assemble signed open release
        env:
          NOTIFYME_KEYSTORE_PASSWORD: ${{ secrets.NOTIFYME_KEYSTORE_PASSWORD }}
          NOTIFYME_KEY_ALIAS: ${{ secrets.NOTIFYME_KEY_ALIAS }}
          NOTIFYME_KEY_PASSWORD: ${{ secrets.NOTIFYME_KEY_PASSWORD }}
        # -PrequireReleaseSigning=true：签名缺失时让 gradle 直接失败，
        # 而不是只 warn 一句然后产出一个未签名的 APK。
        run: ./gradlew --stacktrace assembleOpenRelease -PrequireReleaseSigning=true

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/open/release/notifyme-open.apk
          test -f "$APK" || { echo "::error::未找到 $APK"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Checksum + release notes
        run: |
          cd app/build/outputs/apk/open/release
          sha256sum notifyme-open.apk | tee notifyme-open.apk.sha256
          cd "$GITHUB_WORKSPACE"
          {
            echo "## 安装"
            echo
            echo "下载 \`notifyme-open.apk\` 后在 Android 8.0+ 设备上安装（需允许「安装未知来源应用」）。"
            echo
            echo "首次启动按引导授予：**通知使用权**（必需）、无障碍服务（可选，微信界面直读）、日历权限（可选，写入待办）。"
            echo "然后在「分析设置」里填入你自己的 OpenAI 兼容接口地址、密钥与模型名——发布版不内置任何服务器地址与密钥，未配置即完全离线。"
            echo
            echo "## 校验"
            echo
            echo '\`\`\`'
            cat app/build/outputs/apk/open/release/notifyme-open.apk.sha256
            echo '\`\`\`'
          } > "$RUNNER_TEMP/notes-head.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/open/release/notifyme-open.apk \
            app/build/outputs/apk/open/release/notifyme-open.apk.sha256 \
            --title "notifyme $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes-head.md" \
            --generate-notes \
            --latest
