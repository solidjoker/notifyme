name: release

# 推送 v* tag 时：用仓库 Secrets 里的密钥库签名构建 open release APK，
# 校验签名与版本号，算 SHA256，然后创建 GitHub Release 并挂上产物。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   NOTIFYME_KEYSTORE_BASE64   base64 编码的 .jks 文件
#   NOTIFYME_KEYSTORE_PASSWORD 密钥库口令
#   NOTIFYME_KEY_ALIAS         密钥别名
#   NOTIFYME_KEY_PASSWORD      密钥口令
# 生成 base64（PowerShell）：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("notifyme-release.jks")) | Set-Clipboard
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: 签名构建并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare wrapper for CI
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  versionName=$VN"
          if [ "$TAG" != "$VN" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName=$VN 不一致，请先升版本号"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTIFYME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret NOTIFYME_KEYSTORE_BASE64，无法签名发布（配置方式见本 workflow 顶部注释）"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notifyme-release.jks"
          echo "NOTIFYME_KEYSTORE_FILE=$RUNNER_TEMP/notifyme-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed open release
        env:
          NOTIFYME_KEYSTORE_PASSWORD: ${{ secrets.NOTIFYME_KEYSTORE_PASSWORD }}
          NOTIFYME_KEY_ALIAS: ${{ secrets.NOTIFYME_KEY_ALIAS }}
          NOTIFYME_KEY_PASSWORD: ${{ secrets.NOTIFYME_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleOpenRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/open/release/notifyme-open.apk
          test -f "$APK" || { echo "::error::未找到 $APK"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Checksum + release notes
        run: |
          cd app/build/outputs/apk/open/release
          sha256sum notifyme-open.apk | tee notifyme-open.apk.sha256
          cd "$GITHUB_WORKSPACE"
          {
            echo "## 安装"
            echo
            echo "下载 \`notifyme-open.apk\` 后在 Android 8.0+ 设备上安装（需允许「安装未知来源应用」）。"
            echo
            echo "首次启动按引导授予：**通知使用权**（必需）、无障碍服务（可选，微信界面直读）、日历权限（可选，写入待办）。"
            echo "然后在「分析设置」里填入你自己的 OpenAI 兼容接口地址、密钥与模型名——发布版不内置任何服务器地址与密钥，未配置即完全离线。"
            echo
            echo "## 校验"
            echo
            echo '```'
            cat app/build/outputs/apk/open/release/notifyme-open.apk.sha256
            echo '```'
          } > "$RUNNER_TEMP/notes-head.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/open/release/notifyme-open.apk \
            app/build/outputs/apk/open/release/notifyme-open.apk.sha256 \
            --title "notifyme $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes-head.md" \
            --generate-notes \
            --latest
