name: build

# 每次 push / PR 都验证：双 flavor 能构建、单测通过、服务端 Python 语法正确、
# 且没有把私有命名或本机密钥文件带进仓库。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 上连续推送时，取消上一次还没跑完的构建，避免排队浪费；
# main 上的构建不取消——半截提交被跳过比多跑一次更麻烦。
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android 构建 + 单测
    # 钉住 24.04 而不用 ubuntu-latest：后者将于 2026-10-19 迁到 Ubuntu 26，
    # 预装的 JDK / Android SDK 组合会变，而 CI 是这个仓库唯一的自动化护栏。
    runs-on: ubuntu-24.04
    # 单 job 总超时：ndk + cmake 全量编译在冷缓存下约 15-25 分钟，
    # 超过 60 分钟基本是卡死（等网络 / 等 Gradle 锁），判失败比挂一晚上好。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (缓存依赖)
        # 停在 v5：gradle/actions v6 起缓存组件不再开源，升级即接受 Gradle Terms of Use，
        # 并移除了 configuration-cache 支持。对本仓库（MIT）没有升级收益。
        # 默认就缓存 ~/.gradle/caches（依赖 + 构建缓存），这里额外明确只读策略。
        uses: gradle/actions/setup-gradle@v5
        with:
          # fork 的 PR 不该能往主分支的缓存里写东西
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare wrapper for CI
        run: |
          # 仓库默认 distributionUrl 指向腾讯云镜像（方便国内本地构建）；
          # GitHub 托管 runner 走官方源更稳。只改工作区，不提交。
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Ensure Android SDK platform 34, NDK and CMake
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER" ]; then
            [ -d "$ANDROID_HOME/platforms/android-34" ] || \
              "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
            # M4 native build: versions must match app/build.gradle.kts / CMake
            [ -d "$ANDROID_HOME/ndk/27.2.12479018" ] || \
              "$SDKMANAGER" "ndk;27.2.12479018"
            [ -d "$ANDROID_HOME/cmake/3.31.6" ] || \
              "$SDKMANAGER" "cmake;3.31.6"
          fi

      - name: Fetch llama.cpp v0.5.0 (M4 native source, not committed)
        run: |
          git clone --depth 1 --branch v0.5.0 \
            https://github.com/ggml-org/llama.cpp third_party/llama.cpp
          git -C third_party/llama.cpp describe --tags

      - name: Lint (Android Lint)
        # 不再 `2>&1 | tail -20`：管道会吞掉 gradle 的退出码，lint 红了 CI 仍然是绿的。
        # 也不加 --offline：冷缓存（首次跑 / 缓存被清）时 --offline 会因为缺依赖直接失败。
        run: ./gradlew --console=plain --stacktrace lintOpenDebug

      - name: Unit tests + assemble (open & beta)
        # 单元测试是全量发现（app/src/test 下所有用例），不需要点名字
        run: ./gradlew --stacktrace --console=plain testOpenDebugUnitTest assembleOpenDebug assembleBetaDebug

      - name: Set up Node.js (前端归类纯函数单测)
        # 控制台前端的归类规则放在 server/console_classify.js：浏览器端内联进页面，
        # 测试端由 node 直接跑真逻辑单测。CI 里必须真的有 node，
        # 否则那条用例会被 skip —— 等于这条护栏根本没生效。
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python (pip 缓存)
        # 用 v5：pip 缓存能力自 v4 起就有；大版本固定住，避免上游改默认行为。
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Kotlin 静态检查 (ktlint, 只报警不阻断)
        # 规则集在仓库根的 .editorconfig 里被刻意收窄到 5 条（unused import / import 顺序 /
        # 末行换行 / 连续空行 / 多余的 ${}），其余 standard 规则全部 disabled —— 详由见该文件头注释。
        # 这里用默认 --report 模式：有命中会打印明细与 static-check-summary，但退出码仍是 0，
        # 不阻断 PR。本地验收走 docs/scripts/local_check.ps1 的 --strict 口径。
        # ktlint jar 由脚本按固定版本 + sha256 下载并缓存，不参与 Gradle 依赖图。
        run: python3 docs/scripts/static_check.py

      - name: Python syntax check (server, 目录级)
        # 目录级发现：server/ 下新增 .py 自动纳入，不用再维护一份点死的文件清单
        run: python3 -m compileall -q server

      - name: Server tests (pytest, 目录级发现)
        env:
          # node 缺失时，前端归类纯函数单测必须 fail 而不是静默 skip：
          # 那条用例是控制台归类逻辑唯一的自动化护栏，skip 等于没测。
          REQUIRE_NODE: '1'
        run: |
          python3 -m pip install --upgrade pip
          # 装服务端真实依赖（flask / waitress / pycryptodome / Pillow），别只装 flask
          python3 -m pip install -r server/requirements.txt
          python3 -m pip install pytest
          # 目录级发现：server/test_*.py 里新增的用例自动被跑到
          python3 -m pytest server/ -v --tb=short

      - name: Guard - 隐私与仓库卫生
        # 规则正文只有一份：docs/scripts/privacy_guard.py（CI 与本地跑同一份实现）
        # --forbid-local-secrets：CI 的 checkout 是干净的，工作区里出现 secrets.local.* 即事故
        run: python3 docs/scripts/privacy_guard.py --forbid-local-secrets

      - name: Version check (versionName / versionCode)
        run: python3 docs/scripts/version_check.py

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: notifyme-debug-apks
          path: |
            app/build/outputs/apk/open/debug/notifyme-open.apk
            app/build/outputs/apk/beta/debug/notifyme-test.apk
          if-no-files-found: error
          retention-days: 14
